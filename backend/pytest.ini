# Cấu hình pytest cho backend.
#
# pythonpath = . : thêm thư mục backend/ vào đường dẫn import, nhờ đó test viết
# được "from app.etl import cleaners" dù chạy pytest từ backend/ hay từ gốc
# project (pytest backend). Không có dòng này thì phải cài app thành gói hoặc
# sửa sys.path trong từng file test.
[pytest]
pythonpath = .
testpaths = tests

# Marker "db": test cần PostgreSQL thật (Docker đang chạy). Không kết nối được
# thì các test này tự skip, phần còn lại vẫn chạy. Chỉ chạy nhóm này:
#   python -m pytest -m db
#
# Marker "cham" (chốt 03/11/2026): test chạy lâu — kéo đủ dữ liệu qua socket
# thật, test khứ hồi, test chờ token hết hạn. Chạy nhanh hằng ngày:
#   python -m pytest -m "not cham"
# NHƯNG trước mỗi commit phải chạy ĐỦ bộ test, không bỏ marker nào (QUY_TRINH §4.4).
markers =
    db: test can PostgreSQL that; tu skip khi khong ket noi duoc
    cham: test chay lau (keo du du lieu qua socket that, khu hoi, cho token het han)
