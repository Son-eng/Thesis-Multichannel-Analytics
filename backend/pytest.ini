# Cấu hình pytest cho backend.
#
# pythonpath = . : thêm thư mục backend/ vào đường dẫn import, nhờ đó test viết
# được "from app.etl import cleaners" dù chạy pytest từ backend/ hay từ gốc
# project (pytest backend). Không có dòng này thì phải cài app thành gói hoặc
# sửa sys.path trong từng file test.
[pytest]
pythonpath = .
testpaths = tests
