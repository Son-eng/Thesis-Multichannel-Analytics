# Cấu hình pytest cho máy chủ giả lập — chạy RIÊNG với test của backend.
#
# pythonpath = . : thêm mock_platform/ vào đường dẫn import, để test viết
# "import data_builder". Không thêm backend/ — mock không được import gì từ
# backend (SPEC §13).
#
# Chạy (từ mock_platform/, dùng chung .venv của backend):
#   ..\backend\.venv\Scripts\python -m pytest
[pytest]
pythonpath = .
testpaths = tests
