# Cấu hình pytest cho máy chủ giả lập — chạy RIÊNG với test của backend.
#
# pythonpath = . : thêm mock_platform/ vào đường dẫn import, để test viết
# "import data_builder". Không thêm backend/ — mock không được import gì từ
# backend.
#
# Chạy (từ mock_platform/, dùng chung .venv của backend):
#   ..\backend\.venv\Scripts\python -m pytest
# KHÔNG thêm "-W error::DeprecationWarning" trên dòng lệnh: cờ đó đè lên
# filterwarnings bên dưới, và ngoại lệ hẹp cho anyio mất tác dụng.
[pytest]
pythonpath = .
testpaths = tests

# DeprecationWarning thành lỗi — cùng mức khắt khe với backend.
# Ngoại lệ DUY NHẤT: chính starlette/testclient.py (của fastapi đã ghim) dùng
# alias anyio.abc.BlockingPortal mà anyio đã đánh dấu lỗi thời. Không phải
# code của dự án, không sửa được; không bỏ qua thì không import nổi TestClient.
# Dòng sau thắng dòng trước, nên mọi DeprecationWarning khác vẫn là lỗi.
filterwarnings =
    error::DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
