services:
  postgres:
    image: postgres:16.4-alpine
    container_name: thesis_postgres

    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis_dev_password
      POSTGRES_DB: thesis_analytics
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      - "127.0.0.1:5434:5432"
      - "[::1]:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis -d thesis_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
